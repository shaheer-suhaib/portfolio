<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0a0a0a; padding: 24px 28px; }
  .spec { margin-bottom: 24px; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
  .hero-text {
    font-family: var(--font-display);
    font-size: clamp(38px,6vw,72px);
    font-weight: 500;
    font-style: italic;
    font-variation-settings: "opsz" 144, "SOFT" 80;
    line-height: 0.95;
    letter-spacing: -0.045em;
    background: linear-gradient(267deg, #da7c25 0.36%, #b923e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .section-text {
    font-family: var(--font-display);
    font-size: clamp(32px,5vw,56px);
    font-weight: 500;
    font-variation-settings: "opsz" 96, "SOFT" 30;
    line-height: 1.05;
    letter-spacing: -0.03em;
    background: linear-gradient(267deg, #da7c25 0.36%, #b923e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .card-text {
    font-family: var(--font-display);
    font-size: clamp(20px,2.5vw,34px);
    font-weight: 600;
    font-variation-settings: "opsz" 96, "SOFT" 30;
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: white;
  }
  .sub-text {
    font-family: var(--font-display);
    font-size: clamp(16px,1.8vw,24px);
    font-weight: 600;
    font-variation-settings: "opsz" 48, "SOFT" 20;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: rgba(255,255,255,0.9);
  }
</style>
</head>
<body>
  <div class="spec">
    <div class="label">Hero H1 — Fraunces Italic, SOFT 80, opsz 144, −0.045em</div>
    <div class="hero-text">I'm software engineer<br>based in pakistan</div>
  </div>
  <div class="spec">
    <div class="label">Section Title — Fraunces, SOFT 30, opsz 96, −0.03em</div>
    <div class="section-text">About me</div>
  </div>
  <div class="spec">
    <div class="label">Card Title — Fraunces 600, opsz 96, white</div>
    <div class="card-text">Full Stack Engineer</div>
  </div>
  <div class="spec">
    <div class="label">Sub-heading — Fraunces 600, opsz 48, 90% white</div>
    <div class="sub-text">Get in touch</div>
  </div>
</body>
</html>
