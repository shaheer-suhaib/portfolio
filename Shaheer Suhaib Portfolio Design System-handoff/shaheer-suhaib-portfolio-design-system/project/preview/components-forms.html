<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0a0a0a; padding: 20px; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 10px; }
  .section { margin-bottom: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .form { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 220px; max-width: 320px; }
  input, textarea {
    padding: 12px 18px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05);
    color: white; font-family: var(--font-body); font-size: 13px; font-weight: 400;
    outline: none; transition: all 0.3s; width: 100%;
  }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.5); }
  input:focus, textarea:focus {
    border-color: rgba(185,35,225,0.6); background: rgba(255,255,255,0.08);
    box-shadow: 0 0 20px rgba(185,35,225,0.2); transform: translateY(-2px);
  }
  textarea { min-height: 80px; resize: vertical; }
  .btn-submit {
    padding: 12px 32px; border-radius: 50px;
    background: linear-gradient(267deg, #da7c25 0.36%, #b923e1 100%);
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    color: white; border: none; cursor: pointer; align-self: flex-start;
    box-shadow: 0 4px 15px rgba(185,35,225,0.3);
  }
  .contact-detail {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-radius: 12px;
    background: rgba(185,35,225,0.05); border: 1px solid rgba(185,35,225,0.2);
    transition: all 0.3s;
  }
  .contact-detail:hover { background: rgba(185,35,225,0.15); border-color: rgba(185,35,225,0.5); transform: translateX(5px); }
  .contact-icon { font-size: 18px; color: white; }
  .contact-text { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: white; }
  .details-col { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 220px; max-width: 280px; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Contact Form Inputs</div>
    <div class="row">
      <div class="form">
        <input type="text" placeholder="Your Name" />
        <input type="email" placeholder="Your Email" />
        <textarea placeholder="Your Message"></textarea>
        <button class="btn-submit">Send Message</button>
      </div>
      <div class="details-col">
        <div class="contact-detail">
          <span class="contact-icon">✉</span>
          <span class="contact-text">sh5suhaib.pk@gmail.com</span>
        </div>
        <div class="contact-detail">
          <span class="contact-icon">✆</span>
          <span class="contact-text">+92 3250368509</span>
        </div>
        <div class="contact-detail">
          <span class="contact-icon">⌖</span>
          <span class="contact-text">PK, Islamabad</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
