<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0a0a0a; padding: 20px; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .icon-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    min-width: 62px;
  }
  .icon-item img { width: 32px; height: 32px; object-fit: contain; }
  .icon-name { font-family: var(--font-mono); font-size: 9px; color: rgba(255,255,255,0.45); text-align: center; }
</style>
</head>
<body>
  <div class="label">Tech Stack Icons — assets/icons/</div>
  <div class="grid">
    <div class="icon-item"><img src="../assets/icons/python.svg" alt=""><div class="icon-name">Python</div></div>
    <div class="icon-item"><img src="../assets/icons/java.svg" alt=""><div class="icon-name">Java</div></div>
    <div class="icon-item"><img src="../assets/icons/c-96.png" alt=""><div class="icon-name">C++</div></div>
    <div class="icon-item"><img src="../assets/icons/React.png" alt=""><div class="icon-name">React</div></div>
    <div class="icon-item"><img src="../assets/icons/NodeJs.svg" alt=""><div class="icon-name">Node.js</div></div>
    <div class="icon-item"><img src="../assets/icons/Next.svg" alt=""><div class="icon-name">Next.js</div></div>
    <div class="icon-item"><img src="../assets/icons/Typescript.svg" alt=""><div class="icon-name">TypeScript</div></div>
    <div class="icon-item"><img src="../assets/icons/Javascript.svg" alt=""><div class="icon-name">JavaScript</div></div>
    <div class="icon-item"><img src="../assets/icons/HTML.png" alt=""><div class="icon-name">HTML</div></div>
    <div class="icon-item"><img src="../assets/icons/CSS.png" alt=""><div class="icon-name">CSS</div></div>
    <div class="icon-item"><img src="../assets/icons/MongoDB.svg" alt=""><div class="icon-name">MongoDB</div></div>
    <div class="icon-item"><img src="../assets/icons/Redux.svg" alt=""><div class="icon-name">Redux</div></div>
    <div class="icon-item"><img src="../assets/icons/Langchain.svg" alt=""><div class="icon-name">LangChain</div></div>
    <div class="icon-item"><img src="../assets/icons/Langgraph.svg" alt=""><div class="icon-name">LangGraph</div></div>
    <div class="icon-item"><img src="../assets/icons/crewai.png" alt=""><div class="icon-name">CrewAI</div></div>
    <div class="icon-item"><img src="../assets/icons/tensorflow-96.png" alt=""><div class="icon-name">TensorFlow</div></div>
    <div class="icon-item"><img src="../assets/icons/Docker.svg" alt=""><div class="icon-name">Docker</div></div>
    <div class="icon-item"><img src="../assets/icons/Git.svg" alt=""><div class="icon-name">Git</div></div>
    <div class="icon-item"><img src="../assets/icons/Github.svg" alt=""><div class="icon-name">GitHub</div></div>
    <div class="icon-item"><img src="../assets/icons/arduino-96.png" alt=""><div class="icon-name">Arduino</div></div>
    <div class="icon-item"><img src="../assets/icons/django-96.png" alt=""><div class="icon-name">Django</div></div>
    <div class="icon-item"><img src="../assets/icons/numpy-96.png" alt=""><div class="icon-name">NumPy</div></div>
    <div class="icon-item"><img src="../assets/NUST.png" alt="" style="border-radius:50%;"><div class="icon-name">NUST</div></div>
  </div>
</body>
</html>
